name: Portfolio CI and Artifact Integrity

on:
  push:
    branches:
      - new
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-integrity-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_NAME: portfolio
      GIT_COMMIT: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      BUILD_REPOSITORY: ${{ github.repository }}
      BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
      BUILD_WORKFLOW: ${{ github.workflow }}
      BUILD_RUN_ID: ${{ github.run_id }}
      BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REQUIRE_BUILD_PROVENANCE: 'true'
      CUSTOMER_RELEASE_REPORT_PATH: customer-release-report.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Package manager authority (npm)
        run: npm run check:pm
      - name: Dependency vulnerability gate (high or critical fails)
        run: npm run audit:deps
      - name: Generate CycloneDX dependency SBOM
        run: npm sbom --sbom-format=cyclonedx > portfolio-dependencies.cdx.json
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle size budget
        run: npm run check:budget
      - name: Create and verify SHA-256 build manifest
        shell: bash
        env:
          MANIFEST_IGNORE_PRIVATE_KEY: ${{ secrets.MANIFEST_IGNORE_PRIVATE_KEY }}
          MANIFEST_IGNORE_PUBLIC_KEY: ${{ secrets.MANIFEST_IGNORE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -d .output ]; then
            ARTIFACT_DIR=.output
          elif [ -d dist ]; then
            ARTIFACT_DIR=dist
          else
            echo "Build succeeded but neither .output nor dist exists." >&2
            exit 1
          fi
          tar -czf portfolio-build.tar.gz -C "$ARTIFACT_DIR" .
          node scripts/artifact-integrity.mjs create "$ARTIFACT_DIR" portfolio-manifest.json portfolio-build.tar.gz
          node scripts/artifact-integrity.mjs verify "$ARTIFACT_DIR" portfolio-manifest.json portfolio-build.tar.gz
          node scripts/artifact-integrity.mjs hash portfolio-build.tar.gz portfolio-build.tar.gz.sha256
          node scripts/artifact-integrity.mjs verify-hash portfolio-build.tar.gz portfolio-build.tar.gz.sha256
          node scripts/customer-release-verifier.mjs create portfolio-manifest.json portfolio-build.tar.gz portfolio-manifest-ignore.json
          node scripts/artifact-integrity.mjs hash portfolio-manifest-ignore.json portfolio-manifest-ignore.json.sha256
          TRUSTED_POLICY_HASH="$(cut -d' ' -f1 portfolio-manifest-ignore.json.sha256)"
          node scripts/customer-release-verifier.mjs verify portfolio-manifest-ignore.json portfolio-manifest-ignore.json.sha256 portfolio-manifest.json portfolio-build.tar.gz "$TRUSTED_POLICY_HASH"
          if [[ -n "${MANIFEST_IGNORE_PRIVATE_KEY:-}" && -n "${MANIFEST_IGNORE_PUBLIC_KEY:-}" ]]; then
            umask 077
            private_key_file="$(mktemp "$RUNNER_TEMP/manifest-ignore-private.XXXXXX.pem")"
            public_key_file="$(mktemp "$RUNNER_TEMP/manifest-ignore-public.XXXXXX.pem")"
            cleanup_signing_material() {
              rm -f -- "$private_key_file" "$public_key_file"
              unset MANIFEST_IGNORE_PRIVATE_KEY MANIFEST_IGNORE_PUBLIC_KEY
            }
            trap cleanup_signing_material EXIT
            printf '%s' "$MANIFEST_IGNORE_PRIVATE_KEY" > "$private_key_file"
            printf '%s' "$MANIFEST_IGNORE_PUBLIC_KEY" > "$public_key_file"
            chmod 600 "$private_key_file"
            node scripts/policy-signature.mjs sign portfolio-manifest-ignore.json portfolio-manifest-ignore.sig "$private_key_file"
            node scripts/policy-signature.mjs verify portfolio-manifest-ignore.json portfolio-manifest-ignore.sig "$public_key_file"
            node scripts/customer-release-verifier.mjs verify portfolio-manifest-ignore.json portfolio-manifest-ignore.json.sha256 portfolio-manifest.json portfolio-build.tar.gz - portfolio-manifest-ignore.sig "$public_key_file"
          else
            echo "Signing secrets are not configured; SHA-256 trusted-digest verification ran. Configure MANIFEST_IGNORE_PRIVATE_KEY and MANIFEST_IGNORE_PUBLIC_KEY to enable release signatures."
          fi
      - name: Upload verified build package and provenance
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-build-${{ github.run_number }}
          path: |
            portfolio-build.tar.gz
            portfolio-manifest.json
            portfolio-build.tar.gz.sha256
            portfolio-manifest-ignore.json
            portfolio-manifest-ignore.json.sha256
            portfolio-dependencies.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed manifest-ignore policy
        if: hashFiles('portfolio-manifest-ignore.sig') != ''
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-policy-signature-${{ github.run_number }}
          path: portfolio-manifest-ignore.sig
          if-no-files-found: error
          retention-days: 14
      - name: Retain customer release failure report
        if: always() && hashFiles('customer-release-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-release-failure-${{ github.run_number }}
          path: customer-release-report.json
          if-no-files-found: error
          retention-days: 14

  e2e:
    # Playwright journeys against the production build served under Node with in-memory storage.
    # Credentials are generated per run inside playwright.config.ts; no secret is stored.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Admin browser E2E
        env:
          BROWSER_CHANNEL: chrome
        run: npm run test:e2e

  browser-audit:
    # Advisory: real-browser axe (with contrast), reflow, Web Vitals and HTTP status audit of the
    # production build served locally. Findings are uploaded; they do not block the integrity job.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build for Node (local audit target)
        run: NITRO_PRESET=node-server npm run build
      - name: Serve build and audit
        env:
          BROWSER_CHANNEL: chrome
        run: |
          PORT=4173 node .output/server/index.mjs &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          node scripts/browser-audit.mjs http://localhost:4173 browser-audit-report.json
      - name: Upload audit report
        if: always() && hashFiles('browser-audit-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit-${{ github.run_number }}
          path: browser-audit-report.json
          retention-days: 14
