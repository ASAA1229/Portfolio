name: Portfolio CI and Artifact Integrity

on:
  push:
    branches:
      - devops-integrity-pipeline
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-integrity-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_NAME: portfolio
      GIT_COMMIT: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      REQUIRE_BUILD_PROVENANCE: 'true'
      MANIFEST_IGNORE_PRIVATE_KEY: ${{ secrets.MANIFEST_IGNORE_PRIVATE_KEY }}
      MANIFEST_IGNORE_PUBLIC_KEY: ${{ secrets.MANIFEST_IGNORE_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: ESLint checks (existing Prettier-format debt tracked separately)
        run: "npm run lint -- --rule 'prettier/prettier: off'"
      - name: Tests
        run: npm test
      - name: Create and verify SHA-256 build manifest
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .output ]; then
            ARTIFACT_DIR=.output
          elif [ -d dist ]; then
            ARTIFACT_DIR=dist
          else
            echo "Build succeeded but neither .output nor dist exists." >&2
            exit 1
          fi
          tar -czf portfolio-build.tar.gz -C "$ARTIFACT_DIR" .
          node scripts/artifact-integrity.mjs create "$ARTIFACT_DIR" portfolio-manifest.json portfolio-build.tar.gz
          node scripts/artifact-integrity.mjs verify "$ARTIFACT_DIR" portfolio-manifest.json portfolio-build.tar.gz
          node scripts/artifact-integrity.mjs hash portfolio-build.tar.gz portfolio-build.tar.gz.sha256
          node scripts/artifact-integrity.mjs verify-hash portfolio-build.tar.gz portfolio-build.tar.gz.sha256
          node scripts/customer-release-verifier.mjs create portfolio-manifest.json portfolio-build.tar.gz portfolio-manifest-ignore.json
          node scripts/artifact-integrity.mjs hash portfolio-manifest-ignore.json portfolio-manifest-ignore.json.sha256
          TRUSTED_POLICY_HASH="$(cut -d' ' -f1 portfolio-manifest-ignore.json.sha256)"
          node scripts/customer-release-verifier.mjs verify portfolio-manifest-ignore.json portfolio-manifest-ignore.json.sha256 portfolio-manifest.json portfolio-build.tar.gz "$ARTIFACT_DIR" "$TRUSTED_POLICY_HASH"
          if [[ -n "${MANIFEST_IGNORE_PRIVATE_KEY:-}" && -n "${MANIFEST_IGNORE_PUBLIC_KEY:-}" ]]; then
            private_key_file="$RUNNER_TEMP/manifest-ignore-private.pem"
            public_key_file="$RUNNER_TEMP/manifest-ignore-public.pem"
            trap 'rm -f "$private_key_file" "$public_key_file"' EXIT
            printf '%s' "$MANIFEST_IGNORE_PRIVATE_KEY" > "$private_key_file"
            printf '%s' "$MANIFEST_IGNORE_PUBLIC_KEY" > "$public_key_file"
            chmod 600 "$private_key_file"
            node scripts/policy-signature.mjs sign portfolio-manifest-ignore.json portfolio-manifest-ignore.sig "$private_key_file"
            node scripts/policy-signature.mjs verify portfolio-manifest-ignore.json portfolio-manifest-ignore.sig "$public_key_file"
            node scripts/customer-release-verifier.mjs verify portfolio-manifest-ignore.json portfolio-manifest-ignore.json.sha256 portfolio-manifest.json portfolio-build.tar.gz "$ARTIFACT_DIR" - portfolio-manifest-ignore.sig "$public_key_file"
          else
            echo "Signing secrets are not configured; SHA-256 trusted-digest verification ran. Configure MANIFEST_IGNORE_PRIVATE_KEY and MANIFEST_IGNORE_PUBLIC_KEY to enable release signatures."
          fi
      - name: Upload verified build package and provenance
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-build-${{ github.run_number }}
          path: |
            portfolio-build.tar.gz
            portfolio-manifest.json
            portfolio-build.tar.gz.sha256
            portfolio-manifest-ignore.json
            portfolio-manifest-ignore.json.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload signed manifest-ignore policy
        if: hashFiles('portfolio-manifest-ignore.sig') != ''
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-policy-signature-${{ github.run_number }}
          path: portfolio-manifest-ignore.sig
          if-no-files-found: error
          retention-days: 7
